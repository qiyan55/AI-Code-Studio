# ============================================
# AI Code Studio 项目编译配置
# ============================================
# 注意：当前版本 BuiltinCompiler(v6.3) 暂不读取此文件，
#       预留未来扩展使用。当前编译参数由 BuiltinCompiler 内部默认值决定。
# ============================================

# ---- 项目信息 ----
project.name=AI Code Studio
project.version=6.3
project.versionCode=63
project.package=com.aicodestudio.ide.ai

# ---- 编译参数 ----
# Java 源码/字节码版本（当前固定 1.8，设备端 ECJ 不支持更高版本）
java.source=1.8
java.target=1.8
java.encoding=UTF-8

# Android SDK 版本（当前固定 compileSdk=34，android.jar 为 API34）
android.compileSdk=34
android.minSdk=26
# targetSdk 低于 33 时 BuiltinCompiler v6.3+ 会自动升级到 34
android.targetSdk=34

# ---- 打包选项 ----
# 是否打包项目自带的 jniLibs/*.so（v6.2+ 支持）
package.jniLibs=true
# 是否打包项目自带的 assets/（v6.2+ 支持）
package.assets=true
# 是否排除语音模型 assets（减小包体积，不需要语音功能时设为 true）
package.exclude.voiceModels=false

# ---- 签名配置 ----
# 当前使用内置 debug.keystore（assets/compile/debug.keystore）
# 自定义签名需修改 BuiltinCompiler 代码
signing.keystore=assets/compile/debug.keystore
signing.alias=aicode
signing.password=aicode123

# ---- 性能选项 ----
# 增量编译（未来扩展，当前全量编译）
compile.incremental=false
# d8 优化级别（未来扩展）
compile.d8.optimize=true
# 资源压缩（未来扩展）
compile.resources.compress=true

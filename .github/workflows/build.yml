name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with official tools
      run: |
        # 1. 准备环境
        mkdir -p build/gen build/classes build/dex
        ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
        
        # 2. 编译资源 (aapt2)
        $ANDROID_HOME/build-tools/34.0.0/aapt2 compile --dir src/main/res -o build/res.zip
        
        # 3. 链接资源并生成 R.java (aapt2)
        $ANDROID_HOME/build-tools/34.0.0/aapt2 link -o build/resources.ap_ build/res.zip \
          -I $ANDROID_JAR \
          --manifest src/main/AndroidManifest.xml \
          --java build/gen \
          --min-sdk-version 26 --target-sdk-version 34
          
        # 4. 编译 Java (javac)
        find src/main/java -name "*.java" > build/sources.txt
        find build/gen -name "R.java" >> build/sources.txt
        javac -source 1.8 -target 1.8 -encoding UTF-8 -nowarn \
          -classpath "$ANDROID_JAR:libs/*" -d build/classes @build/sources.txt
          
        # 5. 转 Dex (d8)
        find build/classes -name "*.class" > build/classes.txt
        $ANDROID_HOME/build-tools/34.0.0/d8 --min-api 26 --lib $ANDROID_JAR --output build/dex @build/classes.txt
        
        # 6. 打包 (使用你自带的 python 脚本)
        python3 tools/pack_std.py build/resources.ap_ build/dex/classes.dex src/main/jniLibs build/app-unsigned.apk arm64-v8a
        
        # 7. 对齐与签名 (zipalign + apksigner)
        $ANDROID_HOME/build-tools/34.0.0/zipalign -p 4 build/app-unsigned.apk build/app-aligned.apk
        
        # 自动生成 debug 签名并签名
        keytool -genkey -v -keystore build/debug.keystore -alias aicode -keyalg RSA -keysize 2048 -validity 10000 -storepass aicode123 -keypass aicode123 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks build/debug.keystore --ks-pass pass:aicode123 --key-pass pass:aicode123 --out build/AI_Code_Studio.apk build/app-aligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: build/AI_Code_Studio.apk

# ============================================
# AI Code Studio gradle.properties
# ============================================
# 注意：此文件用于兼容 Android Studio，
#       设备端内置编译器（BuiltinCompiler）不使用 Gradle。
# ============================================

# 项目-wide Gradle 设置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX 设置
android.useAndroidX=true
android.enableJetifier=true

# 构建缓存
android.enableBuildCache=true

# R8 代码混淆（正式构建时启用）
android.enableR8=true

# 非传递 R 类（减少编译时间）
android.nonTransitiveRClass=true

# 应用唯一包名
APPLICATION_ID=com.aicodestudio.ide
APP_NAME=AI Code Studio
VERSION_CODE=76
VERSION_NAME=1.76

# 编译 SDK 版本
COMPILE_SDK=34
MIN_SDK=26
TARGET_SDK=34

# 构建工具版本
BUILD_TOOLS=34.0.0
